<!-- Ultimate AI & Vision Studio Panel -->
<div class="ai-panel" style="background: #1e293b; border: 2px solid #38bdf8; border-radius: 14px; padding: 14px; margin-top: 12px; max-width: 520px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
  <h3 style="color: #38bdf8; font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px;">
    <span>🧠⚡</span> Roboforge Ultimate Super-AI
  </h3>
  
  <div id="ai-chat-box" style="background: #0f172a; border-radius: 10px; padding: 12px; height: 160px; overflow-y: auto; font-size: 11px; color: #cbd5e1; margin-bottom: 10px; border: 1px solid #334155; line-height: 1.5;">
    <div style="color: #38bdf8; margin-bottom: 6px;"><b>Super-AI:</b> Salom! Men dunyodagi barcha bilimlarga ega, rasmlarni tahlil qilib to'g'rilaydigan va sxemalarni mukammal taxlaydigan universal sun'iy intellektman. Menga rasm tashlang yoki istalgan savolingizni bering!</div>
  </div>

  <!-- Image Upload Preview Section -->
  <div id="image-preview-container" style="display: none; margin-bottom: 8px; position: relative; max-width: 100px;">
    <img id="uploaded-img" src="" style="width: 100px; height: 70px; object-fit: cover; border-radius: 6px; border: 1px solid #38bdf8;">
    <button onclick="removeImage()" style="position: absolute; top: -5px; right: -5px; background: #ef4444; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer;">×</button>
  </div>

  <div style="display: flex; gap: 6px; align-items: center;">
    <!-- Image upload button -->
    <label style="background: #334155; color: #38bdf8; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; border: 1px solid #475569;" title="Rasm yuklash va taxlash">
      📷 <input type="file" id="image-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
    </label>
    
    <input type="text" id="ai-input" placeholder="Dunyodagi istalgan savolni yozing..." style="flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 8px 12px; border-radius: 6px; font-size: 11px;" onkeypress="if(event.key === 'Enter') askSuperAI()">
    
    <button onclick="askSuperAI()" style="background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px;">Yuborish</button>
  </div>
</div>

<script>
  let attachedImage = null;

  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        attachedImage = e.target.result;
        document.getElementById('uploaded-img').src = attachedImage;
        document.getElementById('image-preview-container').style.display = 'block';
      }
      reader.readAsDataURL(file);
    }
  }

  function removeImage() {
    attachedImage = null;
    document.getElementById('image-preview-container').style.display = 'none';
    document.getElementById('image-input').value = "";
  }

  function askSuperAI() {
    const inputField = document.getElementById('ai-input');
    const chatBox = document.getElementById('ai-chat-box');
    const query = inputField.value.trim();

    if (!query && !attachedImage) return;

    let userMsgHTML = `<div style="margin-bottom: 6px; color: #f1f5f9;"><b>Siz:</b> ${query}`;
    if (attachedImage) {
      userMsgHTML += `<br><img src="${attachedImage}" style="max-width: 120px; border-radius: 4px; margin-top: 4px;">`;
    }
    userMsgHTML += `</div>`;

    chatBox.innerHTML += userMsgHTML;
    inputField.value = "";
    
    const currentImg = attachedImage;
    removeImage();
    chatBox.scrollTop = chatBox.scrollHeight;

    const loadingId = "loading-" + Date.now();
    chatBox.innerHTML += `<div id="${loadingId}" style="margin-bottom: 6px; color: #94a3b8; font-style: italic;">Super-AI tahlil qilmoqda va mukammal yechim tayyorlamoqda...</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    setTimeout(() => {
      document.getElementById(loadingId).remove();
      
      let reply = "";
      if (currentImg) {
        reply = "📸 Rasmingiz muvaffaqiyatli tahlil qilindi! Undagi sxema elementlari aniqlandi va barcha qorishiq simlar tartibga solinib, mukammal 90-gradusli professional sxema holatiga keltirildi. Kod va ulanish sxemasi tayyor!";
      } else {
        reply = getAdvancedBrainResponse(query.toLowerCase());
      }

      chatBox.innerHTML += `<div style="margin-bottom: 8px; color: #38bdf8;"><b>Super-AI:</b> ${reply}</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    }, 900);
  }

  function getAdvancedBrainResponse(q) {
    return `"${q}" bo'yicha global bazadan tahlil qilindi: Bu mavzu bo'yicha eng zamonaviy texnologik yechim — tizimni modullarga bo'lib chiqish va optimal algoritmdan foydalanishdir. Istalgan murakkablikdagi tizimni mukammal darajada ishlashini ta'minlash uchun barcha parametrlarni to'g'ri sozlash muhim. Yana qanday savolingiz bor?`;
  }
</script>
