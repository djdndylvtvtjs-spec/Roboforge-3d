<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SHOHJAHON TECH AI</title>
<style>
  :root{
    --bg:#050a0f;
    --ring:#3ee6ff;
    --ring-dim:#0f5b6b;
    --amber:#ffb454;
    --red:#ff6b6b;
    --text:#d9f4ff;
    --text-dim:#5c8a95;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; margin:0; background:radial-gradient(ellipse at 50% -10%, #0e2530 0%, var(--bg) 55%), var(--bg); color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif; overflow:hidden; }
  body{ display:flex; flex-direction:column; height:100vh; height:100dvh; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }

  header{ text-align:center; padding-top:10px; flex-shrink:0; }
  .brand{ font-size:14px; letter-spacing:5px; color:var(--ring); text-shadow:0 0 12px rgba(62,230,255,.6); font-weight:700; }
  .brand small{ display:block; letter-spacing:2px; color:var(--amber); font-size:10px; margin-top:3px; }

  .controls-row{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:8px; flex-wrap:wrap; }
  .mode-group{ display:flex; align-items:center; gap:6px; }
  .mode-label{ font-size:10px; letter-spacing:1px; color:var(--text-dim); }
  
  select#lang-select{ background:#0e2530; border:1px solid var(--ring-dim); color:var(--ring); padding:3px 8px; border-radius:14px; font-size:11px; outline:none; cursor:pointer; }
  
  .switch{ position:relative; width:38px; height:20px; }
  .switch input{ opacity:0; width:0; height:0; }
  .slider{ position:absolute; inset:0; background:#0f2530; border:1px solid var(--ring-dim); border-radius:20px; cursor:pointer; transition:.2s; }
  .slider:before{ content:""; position:absolute; width:14px; height:14px; left:2px; top:2px; background:var(--text-dim); border-radius:50%; transition:.2s; }
  input:checked + .slider{ background:rgba(62,230,255,.15); border-color:var(--ring); }
  input:checked + .slider:before{ transform:translateX(18px); background:var(--ring); box-shadow:0 0 8px var(--ring); }

  main{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; min-height:0; }

  .core-wrap{ position:relative; width:min(48vw, 190px); aspect-ratio:1; flex-shrink:0; }
  svg.rings{ width:100%; height:100%; overflow:visible; }
  .ring{ fill:none; stroke:var(--ring-dim); stroke-width:1; transform-origin:center; }
  .spin-slow{ animation: spin 14s linear infinite; }
  .spin-rev{ animation: spin 9s linear infinite reverse; }
  .spin-fast{ animation: spin 5s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .pulse{ animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.08); opacity:.7; } }

  #mic-btn{ position:absolute; inset:0; margin:auto; width:38%; height:38%; border-radius:50%; border:none; cursor:pointer; background:radial-gradient(circle at 35% 30%, #123240, #061319 70%); box-shadow:0 0 0 1px var(--ring-dim), 0 0 24px rgba(62,230,255,.15) inset; display:flex; align-items:center; justify-content:center; transition:box-shadow .25s ease, transform .15s ease; }
  #mic-btn:active{ transform:scale(.96); }
  #mic-btn.listening{ box-shadow:0 0 0 1px var(--ring), 0 0 30px rgba(62,230,255,.55), 0 0 60px rgba(62,230,255,.25) inset; }
  #mic-btn.armed{ box-shadow:0 0 0 1px var(--amber), 0 0 22px rgba(255,180,84,.4); }
  #mic-btn svg{ width:46%; height:46%; }
  #mic-btn path{ fill:var(--ring); }
  #mic-btn.armed path{ fill:var(--amber); }

  .bars{ position:absolute; bottom:-20px; left:0; right:0; display:flex; justify-content:center; gap:3px; height:14px; }
  .bars span{ width:3px; background:var(--ring); border-radius:2px; height:4px; opacity:.35; transition:height .12s ease, opacity .12s ease; }
  .bars.active span{ opacity:1; animation: bar 0.9s ease-in-out infinite; }
  .bars span:nth-child(1){ animation-delay:0s; } .bars span:nth-child(2){ animation-delay:.1s; }
  .bars span:nth-child(3){ animation-delay:.2s; } .bars span:nth-child(4){ animation-delay:.3s; }
  .bars span:nth-child(5){ animation-delay:.15s; } .bars span:nth-child(6){ animation-delay:.25s; }
  .bars span:nth-child(7){ animation-delay:.05s; }
  @keyframes bar{ 0%,100%{ height:4px; } 50%{ height:14px; } }

  #status{ font-size:11px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; min-height:16px; text-align:center; margin-top:6px; }
  #status.on{ color:var(--ring); text-shadow:0 0 8px rgba(62,230,255,.5); }
  #status.armed{ color:var(--amber); }
  #err{ color:var(--red); font-size:11px; text-align:center; min-height:14px; }

  #panels{ width:100%; max-width:480px; display:flex; flex-direction:column; gap:6px; flex-shrink:1; min-height:0; }

  #active-list{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; max-height:50px; overflow-y:auto; }
  .chip{ font-size:11px; background:rgba(62,230,255,.08); border:1px solid rgba(62,230,255,.25); color:var(--ring); padding:3px 8px; border-radius:20px; display:flex; align-items:center; gap:6px; }
  .chip button{ background:none; border:none; color:var(--red); font-size:12px; cursor:pointer; padding:0; line-height:1; }

  #transcript-box{ width:100%; background:linear-gradient(180deg, rgba(14,37,48,.55), rgba(10,20,28,.35)); border:1px solid rgba(62,230,255,.15); border-radius:12px; padding:10px 12px; max-height:22vh; overflow-y:auto; font-size:13px; line-height:1.45; }
  #transcript-box::-webkit-scrollbar{ width:4px; }
  #transcript-box::-webkit-scrollbar-thumb{ background:var(--ring-dim); border-radius:4px; }
  .line{ margin-bottom:6px; }
  .line .who{ font-weight:700; letter-spacing:1px; font-size:10px; margin-right:6px; }
  .line.user .who{ color:var(--amber); }
  .line.shohjahon .who{ color:var(--ring); }
  .line.ghost{ opacity:.4; }
  .line span.txt{ color:var(--text); }
  .empty-hint{ color:var(--text-dim); font-size:12px; text-align:center; padding:4px 0; }

  footer{ flex-shrink:0; padding:6px 0 2px; text-align:center; }
  .cmds{ font-size:9.5px; color:var(--text-dim); line-height:1.4; }
  .cmds b{ color:var(--text); font-weight:600; }
</style>
</head>
<body>

<header>
  <div class="brand">S H O H J A H O N . T E C H
    <small>Multilingual AI Core</small>
  </div>
  <div class="controls-row">
    <div class="mode-group">
      <span class="mode-label">TIL / LANG:</span>
      <select id="lang-select">
        <option value="uz-UZ" selected>O'zbekcha</option>
        <option value="ru-RU">Русский</option>
        <option value="en-US">English</option>
      </select>
    </div>
    <div class="mode-group">
      <span class="mode-label">UZLUKSIZ</span>
      <label class="switch">
        <input type="checkbox" id="wake-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>
</header>

<main>
  <div class="core-wrap">
    <svg class="rings" viewBox="0 0 200 200">
      <circle id="r1" class="ring spin-slow" cx="100" cy="100" r="95" stroke-dasharray="4 10"/>
      <circle id="r2" class="ring spin-rev" cx="100" cy="100" r="80" stroke-dasharray="2 6"/>
      <circle id="r3" class="ring spin-fast" cx="100" cy="100" r="66" stroke-dasharray="1 200"/>
    </svg>
    <button id="mic-btn" aria-label="Mikrofon">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 11z"/></svg>
    </button>
    <div class="bars" id="bars">
      <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <div id="status">Tayyor — tugmani bosing</div>
  <div id="err"></div>

  <div id="panels">
    <div id="active-list"></div>
    <div id="transcript-box">
      <div class="empty-hint" id="empty-hint">Shohjahon Tech bilan muloqot shu yerda ko'rinadi...</div>
    </div>
  </div>
</main>

<footer>
  <div class="cmds">
    <b>Buyruqlar:</b> "vazifa qo'sh", "soat necha", "google'da qidir ...", "youtube och", "github och", "tinkercad och"
  </div>
</footer>

<script>
(function(){
  const micBtn = document.getElementById('mic-btn');
  const statusEl = document.getElementById('status');
  const errEl = document.getElementById('err');
  const box = document.getElementById('transcript-box');
  const emptyHint = document.getElementById('empty-hint');
  const barsEl = document.getElementById('bars');
  const wakeToggle = document.getElementById('wake-toggle');
  const langSelect = document.getElementById('lang-select');
  const activeList = document.getElementById('active-list');

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizing = false;
  let recognition = null;
  let manuallyStoppedForSpeak = false;
  let sessionActive = false;
  let wakeMode = false;
  let currentLang = 'uz-UZ';

  let tasks = JSON.parse(localStorage.getItem('sh_tasks') || '[]');

  const GREETINGS = {
    'uz-UZ': "Salom! Men Shohjahon Techman. Istalgan tilda buyruq bering.",
    'ru-RU': "Привет! Я Shohjahon Tech. Отдавайте команды на любом языке.",
    'en-US': "Hello! I am Shohjahon Tech. Give me commands in any language."
  };

  function addLine(who, text, ghost){
    if(emptyHint) emptyHint.remove();
    const div = document.createElement('div');
    div.className = 'line ' + (who === 'Siz' ? 'user' : 'shohjahon') + (ghost ? ' ghost' : '');
    div.innerHTML = `<span class="who">${who}:</span><span class="txt"></span>`;
    div.querySelector('.txt').textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function saveTasks(){
    localStorage.setItem('sh_tasks', JSON.stringify(tasks));
    renderActiveList();
  }

  function renderActiveList(){
    activeList.innerHTML = '';
    tasks.forEach((t, index) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = `📌 ${t} <button data-index="${index}">✕</button>`;
      activeList.appendChild(chip);
    });
    activeList.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        tasks.splice(Number(btn.dataset.index), 1);
        saveTasks();
      };
    });
  }
  renderActiveList();

  function speak(text){
    addLine('Shohjahon', text);
    if(!('speechSynthesis' in window)) return;
    if(recognizing){ manuallyStoppedForSpeak = true; recognition.stop(); }
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = currentLang;
    utter.rate = 1;
    const voices = speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(currentLang.slice(0,2)));
    if(voice) utter.voice = voice;
    utter.onend = () => {
      if(sessionActive && wakeMode && !recognizing){
        try{ recognition.start(); }catch(e){}
      }
    };
    speechSynthesis.speak(utter);
  }

  function tryCalculate(text){
    let t = text.replace(/plyus|плюс|\+/g, '+').replace(/minus|минус|\-/g, '-').replace(/ko'paytirish|умножить|\*/g, '*').replace(/bo'lish|делить|\//g, '/');
    const match = t.match(/(-?\d+(\.\d+)?\s*[\+\-\*\/]\s*-?\d+(\.\d+)?)/);
    if(!match) return null;
    try{
      const res = Function('"use strict"; return (' + match[1] + ')')();
      return (typeof res === 'number' && isFinite(res)) ? Math.round(res * 10000) / 10000 : null;
    }catch(e){ return null; }
  }

  function handleCommand(cmdRaw){
    const cmd = cmdRaw.toLowerCase();

    if(/(chiq|stop|выход|exit)/.test(cmd)){
      speak(currentLang === 'ru-RU' ? "До свидания!" : currentLang === 'en-US' ? "Goodbye!" : "Xayr!");
      if(sessionActive){ sessionActive = false; wakeToggle.checked = false; wakeMode = false; if(recognition) recognition.stop(); }
      return;
    }
    if(cmd.includes('tozala') || cmd.includes('очистить') || cmd.includes('clear')){
      box.innerHTML = '';
      speak(currentLang === 'ru-RU' ? "История очищена." : currentLang === 'en-US' ? "Chat cleared." : "Suhbat tozalandi.");
      return;
    }
    if(cmd.includes('soat necha') || cmd.includes('сколько время') || cmd.includes('what time')){
      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      speak(currentLang === 'ru-RU' ? `Текущее время: ${timeStr}` : currentLang === 'en-US' ? `Current time is ${timeStr}` : `Hozir soat ${timeStr}`);
      return;
    }
    if(cmd.includes('vazifa') || cmd.includes('задач') || cmd.includes('task')){
      let item = cmd.replace(/vazifa qo'sh|vazifa yoz|добавить задачу|add task/g, '').trim();
      if(item && (cmd.includes('qo\'sh') || cmd.includes('добавить') || cmd.includes('add'))){
        tasks.push(item);
        saveTasks();
        speak(currentLang === 'ru-RU' ? `Задача добавлена: ${item}` : currentLang === 'en-US' ? `Task added: ${item}` : `Vazifa qo'shildi: ${item}`);
      } else {
        speak(tasks.length === 0 ? "Vazifalaringiz yo'q." : "Vazifalar: " + tasks.join(', '));
      }
      return;
    }
    const calc = tryCalculate(cmd);
    if(calc !== null){
      speak(currentLang === 'ru-RU' ? `Результат: ${calc}` : currentLang === 'en-US' ? `Result: ${calc}` : `Natija: ${calc}`);
      return;
    }
    if(cmd.includes('qidir') || cmd.includes('найди') || cmd.includes('search')){
      const q = cmd.replace(/.*(qidir|найди|search)/, '').trim();
      if(q){
        speak(currentLang === 'ru-RU' ? `Ищу в Google: ${q}` : currentLang === 'en-US' ? `Searching Google for ${q}` : `${q} bo'yicha qidiryapman`);
        window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
      }
      return;
    }
    if(cmd.includes('youtube')){
      window.open('https://youtube.com', '_blank');
      speak("YouTube");
      return;
    }
    if(cmd.includes('github')){
      window.open('https://github.com', '_blank');
      speak("GitHub");
      return;
    }
    if(cmd.includes('tinkercad')){
      window.open('https://www.tinkercad.com', '_blank');
      speak("Tinkercad");
      return;
    }
    window.open(`https://www.google.com/search?q=${encodeURIComponent(cmdRaw)}`, '_blank');
    speak(cmdRaw);
  }

  function setListeningUI(on, armed){
    recognizing = on;
    micBtn.classList.toggle('listening', on && !armed);
    micBtn.classList.toggle('armed', !!armed);
    barsEl.classList.toggle('active', on);
    statusEl.classList.toggle('on', on && !armed);
    statusEl.classList.toggle('armed', !!armed);
    statusEl.textContent = armed ? 'Awaiting trigger...' : (on ? 'Listening...' : 'Ready');
    document.getElementById('r3').classList.toggle('pulse', on);
  }

  if(SpeechRecognition){
    recognition = new SpeechRecognition();
    recognition.lang = currentLang;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;

    recognition.onstart = () => { errEl.textContent=''; setListeningUI(true, false); };
    recognition.onerror = (e) => { setListeningUI(false, sessionActive); };
    recognition.onend = () => {
      setListeningUI(false, sessionActive);
      if(manuallyStoppedForSpeak){ manuallyStoppedForSpeak = false; return; }
      if(sessionActive){ try{ recognition.start(); }catch(e){} }
    };
    recognition.onresult = (event) => {
      const text = event.results[0][0].transcript;
      addLine('Siz', text);
      handleCommand(text);
    };

    langSelect.addEventListener('change', () => {
      currentLang = langSelect.value;
      recognition.lang = currentLang;
      speak(GREETINGS[currentLang] || "Language changed.");
    });

    micBtn.addEventListener('click', () => {
      if(recognizing){ recognition.stop(); }
      else { try{ recognition.start(); }catch(e){} }
    });
  }
})();
</script>
</body>
</html>
