<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RoboCraft 3D - Yig'ish va Sochish Simulyatori</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #090d16; color: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
    header { text-align: center; margin-bottom: 10px; }
    h1 { color: #38bdf8; font-size: 20px; }
    p { color: #94a3b8; font-size: 12px; }
    .main-layout { display: flex; flex-wrap: wrap; gap: 12px; max-width: 1000px; width: 100%; justify-content: center; }
    #sim-canvas { background: #111827; border: 2px solid #0284c7; border-radius: 12px; width: 100%; max-width: 650px; height: 380px; touch-action: none; }
    .controls { background: #1e293b; border-radius: 12px; padding: 15px; flex: 1; min-width: 280px; max-width: 350px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #334155; }
    .btn { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn:active { transform: scale(0.97); }
    .btn-secondary { background: #3b82f6; }
    .btn-outline { background: transparent; border: 1px solid #38bdf8; color: #38bdf8; }
    .slider-group { display: flex; flex-direction: column; gap: 6px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
    label { font-size: 12px; color: #38bdf8; display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; accent-color: #38bdf8; cursor: pointer; }
    .status-box { background: #0f172a; padding: 10px; border-radius: 6px; font-size: 12px; font-family: monospace; color: #4ade80; border: 1px solid #334155; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <header>
    <h1>🤖 RoboCraft 3D Assembler</h1>
    <p>Robot modullarini sochish va qayta yig'ish simulyatsiyasi</p>
  </header>

  <div class="main-layout">
    <div id="sim-canvas"></div>

    <div class="controls">
      <h3>Boshqaruv Paneli</h3>

      <div class="slider-group">
        <label for="explodeSlider">
          <span>🧩 Sochish / Yig'ish:</span>
          <strong id="explodeVal">0%</strong>
        </label>
        <input type="range" id="explodeSlider" min="0" max="100" value="0" oninput="setExplodeFactor(this.value)">
      </div>

      <button class="btn" onclick="animateTo(100)">🧩 To'liq Sochish</button>
      <button class="btn btn-secondary" onclick="animateTo(0)">🛠 To'liq Yig'ish</button>
      <button class="btn btn-outline" onclick="toggleAutoRotate()">🔄 Avto-Aylantirish</button>

      <div class="status-box" id="status-log">> Robot yig'ilgan holatda. Slayderni surib ko'ring!</div>
    </div>
  </div>

  <script>
    const container = document.getElementById('sim-canvas');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(4, 3, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Yorug'lik
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    // Tor katakli zamin (Grid)
    const grid = new THREE.GridHelper(10, 20, 0x0284c7, 0x1e293b);
    grid.position.y = -1;
    scene.add(grid);

    // --- ROBOT QISMLARI (PARTS) ---
    const parts = [];

    function addPart(mesh, name, originPos, explodedPos) {
      mesh.position.copy(originPos);
      scene.add(mesh);
      parts.push({
        mesh: mesh,
        name: name,
        origin: originPos.clone(),
        exploded: explodedPos.clone()
      });
    }

    // 1. Karkas (Chassis) - Asos
    const chassisGeo = new THREE.BoxGeometry(2.2, 0.15, 3);
    const chassisMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
    const chassis = new THREE.Mesh(chassisGeo, chassisMat);
    addPart(chassis, "Korpus (Chassis)", new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -0.5, 0));

    // 2. Mikrokontroller (Arduino / ESP32)
    const boardGeo = new THREE.BoxGeometry(1.6, 0.1, 2);
    const boardMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 });
    const board = new THREE.Mesh(boardGeo, boardMat);
    addPart(board, "Boshqaruv Platalari", new THREE.Vector3(0, 0.15, 0), new THREE.Vector3(0, 1.2, 0));

    // 3. Ultratovushli Sensor
    const sensorGroup = new THREE.Group();
    const sensorBaseGeo = new THREE.BoxGeometry(0.8, 0.3, 0.1);
    const sensorMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
    const sensorBase = new THREE.Mesh(sensorBaseGeo, sensorMat);
    sensorGroup.add(sensorBase);

    const eyeGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.15, 16);
    const eyeMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
    const eye1 = new THREE.Mesh(eyeGeo, eyeMat);
    eye1.rotation.x = Math.PI / 2;
    eye1.position.set(-0.2, 0, 0.08);
    const eye2 = eye1.clone();
    eye2.position.set(0.2, 0, 0.08);
    sensorGroup.add(eye1, eye2);
    addPart(sensorGroup, "Ultratovush Sensori", new THREE.Vector3(0, 0.3, 1.4), new THREE.Vector3(0, 1.0, 2.5));

    // 4. Chap G'ildirak + Mator
    const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.2, 24);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
    
    const wheelL = new THREE.Mesh(wheelGeo, wheelMat);
    wheelL.rotation.z = Math.PI / 2;
    addPart(wheelL, "Chap G'ildirak", new THREE.Vector3(-1.25, 0, 0.5), new THREE.Vector3(-2.3, 0, 0.5));

    // 5. O'ng G'ildirak + Mator
    const wheelR = new THREE.Mesh(wheelGeo, wheelMat);
    wheelR.rotation.z = Math.PI / 2;
    addPart(wheelR, "O'ng G'ildirak", new THREE.Vector3(1.25, 0, 0.5), new THREE.Vector3(2.3, 0, 0.5));

    // 6. Batareya Bloki
    const battGeo = new THREE.BoxGeometry(1.2, 0.3, 0.8);
    const battMat = new THREE.MeshStandardMaterial({ color: 0xeab308 });
    const batt = new THREE.Mesh(battGeo, battMat);
    addPart(batt, "Batareya Quvvat Manbai", new THREE.Vector3(0, 0.25, -0.9), new THREE.Vector3(0, 1.5, -1.8));


    // --- MANTIQLAR VA ANIMATSIYA ---
    let currentFactor = 0;
    let targetFactor = 0;
    let isAnimating = false;

    function setExplodeFactor(val) {
      targetFactor = val / 100;
      document.getElementById('explodeVal').innerText = val + '%';
      if (val == 100) logStatus("Robot to'liq sochildi 🧩");
      else if (val == 0) logStatus("Robot to'liq yig'ildi 🛠");
      else logStatus(`Sochilish darajasi: ${val}%`);
    }

    function animateTo(val) {
      document.getElementById('explodeSlider').value = val;
      setExplodeFactor(val);
    }

    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
      logStatus(controls.autoRotate ? "Avto-aylantirish yoqildi 🔄" : "Avto-aylantirish o'chirildi");
    }

    function logStatus(msg) {
      document.getElementById('status-log').innerText = '> ' + msg;
    }

    function animate() {
      requestAnimationFrame(animate);
      
      // Slayder harakatini tekis silliqlash (Lerp)
      currentFactor += (targetFactor - currentFactor) * 0.1;

      parts.forEach(part => {
        part.mesh.position.lerpVectors(part.origin, part.exploded, currentFactor);
      });

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
